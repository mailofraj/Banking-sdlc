name: CI/CD Deploy to AWS Fargate

on:
  push:
    branches: [ main ]

env:
  ECR_REPOSITORY: banking-sdlc
  ECR_REPOSITORY_SDLC: banking-sdlc-dashboard
  CONTAINER_NAME: banking-sdlc
  CONTAINER_NAME_SDLC: banking-sdlc-dashboard

jobs:
  # ── Job 1: Deploy Demo Bank (port 80) ──────────────────────────────────────
  deploy-bank:
    name: Deploy Demo Bank
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Demo Bank image
        id: build-bank
        run: |
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_OUTPUT
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Render ECS task definition (Bank)
        id: render-bank
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-bank.outputs.IMAGE_URI }}

      - name: Deploy Demo Bank to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-bank.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

  # ── Job 2: Deploy SDLC Dashboard (port 8080) ───────────────────────────────
  deploy-sdlc:
    name: Deploy SDLC Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDLC branch
        uses: actions/checkout@v4
        with:
          ref: sdlc-dashboard

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Ensure SDLC ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY_SDLC }} \
            || aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY_SDLC }}

      - name: Build and push SDLC Dashboard image
        id: build-sdlc
        run: |
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY_SDLC }}:${{ github.sha }}
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_OUTPUT
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Render ECS task definition (SDLC)
        id: render-sdlc
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/task-def-sdlc.json
          container-name: ${{ env.CONTAINER_NAME_SDLC }}
          image: ${{ steps.build-sdlc.outputs.IMAGE_URI }}

      - name: Deploy SDLC Dashboard to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-sdlc.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_SDLC }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
