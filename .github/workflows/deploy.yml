name: CI/CD Deploy to AWS Fargate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION:          ${{ secrets.AWS_REGION }}
  CLUSTER:             banking-sdlc-cluster
  ALB_NAME:            banking-sdlc-cluster-alb
  EXEC_ROLE_NAME:      banking-sdlc-cluster-task-exec-role
  ECR_REPO_BANK:       banking-sdlc
  ECR_REPO_SDLC:       banking-sdlc-dashboard
  SERVICE_BANK:        banking-sdlc-service
  SERVICE_SDLC:        banking-sdlc-dashboard-service
  CONTAINER_BANK:      banking-sdlc
  CONTAINER_SDLC:      banking-sdlc-dashboard

# ── Job 1: Deploy Demo Bank (port 80) ─────────────────────────────────────────
jobs:
  deploy-bank:
    name: Deploy Demo Bank → port 80
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region:            ${{ secrets.AWS_REGION }}
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build Demo Bank
        run: |
          npm install --legacy-peer-deps
          CI=false npm run build

      - name: Build and push Demo Bank image
        id: build
        run: |
          set -eo pipefail
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO_BANK }}:${{ github.sha }}
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_OUTPUT
          docker build --platform linux/amd64 -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Ensure ECR repo exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPO_BANK }} \
            || aws ecr create-repository --repository-name ${{ env.ECR_REPO_BANK }}

      - name: Provision & deploy Demo Bank ECS service
        env:
          IMAGE_URI: ${{ steps.build.outputs.IMAGE_URI }}
        run: |
          set -eo pipefail
          set -x

          LOG_GROUP="/ecs/${CLUSTER}"
          REGION="${{ env.AWS_REGION }}"

          # ── Resolve networking ──────────────────────────────────────────────
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query "Vpcs[0].VpcId" --output text)

          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=${VPC_ID}" \
            --query "Subnets[*].SubnetId" --output text | tr '\t' ',')

          # ── Resolve or create ALB security group ────────────────────────────
          SG_ID=$(aws elbv2 describe-load-balancers \
            --names "${{ env.ALB_NAME }}" \
            --query "LoadBalancers[0].SecurityGroups[0]" \
            --output text 2>/dev/null || true)

          if [ -z "$SG_ID" ] || [ "$SG_ID" = "None" ]; then
            echo "ALB not found — creating security group and ALB..."
            SG_ID=$(aws ec2 create-security-group \
              --group-name "${CLUSTER}-alb-sg" \
              --description "ALB security group for ${CLUSTER}" \
              --vpc-id "$VPC_ID" \
              --query "GroupId" --output text)

            aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
              --protocol tcp --port 80 --cidr 0.0.0.0/0
            aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
              --protocol tcp --port 8080 --cidr 0.0.0.0/0
            aws ec2 authorize-security-group-egress --group-id "$SG_ID" \
              --protocol -1 --port -1 --cidr 0.0.0.0/0 2>/dev/null || true

            ALB_ARN=$(aws elbv2 create-load-balancer \
              --name "${{ env.ALB_NAME }}" \
              --subnets $(echo $SUBNET_IDS | tr ',' ' ') \
              --security-groups "$SG_ID" \
              --query "LoadBalancers[0].LoadBalancerArn" --output text)
            ALB_DNS=$(aws elbv2 describe-load-balancers \
              --load-balancer-arns "$ALB_ARN" \
              --query "LoadBalancers[0].DNSName" --output text)
          else
            ALB_ARN=$(aws elbv2 describe-load-balancers \
              --names "${{ env.ALB_NAME }}" \
              --query "LoadBalancers[0].LoadBalancerArn" --output text)
            ALB_DNS=$(aws elbv2 describe-load-balancers \
              --names "${{ env.ALB_NAME }}" \
              --query "LoadBalancers[0].DNSName" --output text)
          fi
          echo "ALB ARN: $ALB_ARN"
          echo "ALB DNS: $ALB_DNS"

          # ── ECS Cluster ─────────────────────────────────────────────────────
          aws ecs create-cluster --cluster-name "${CLUSTER}" 2>/dev/null || true

          # ── IAM Execution Role ──────────────────────────────────────────────
          EXEC_ROLE_ARN=$(aws iam get-role \
            --role-name "${{ env.EXEC_ROLE_NAME }}" \
            --query "Role.Arn" --output text 2>/dev/null || true)

          if [ -z "$EXEC_ROLE_ARN" ] || [ "$EXEC_ROLE_ARN" = "None" ]; then
            echo "Creating ECS task execution role..."
            EXEC_ROLE_ARN=$(aws iam create-role \
              --role-name "${{ env.EXEC_ROLE_NAME }}" \
              --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"ecs-tasks.amazonaws.com"},"Action":"sts:AssumeRole"}]}' \
              --query "Role.Arn" --output text)
            aws iam attach-role-policy \
              --role-name "${{ env.EXEC_ROLE_NAME }}" \
              --policy-arn arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
            # Allow a few seconds for IAM propagation
            sleep 10
          fi
          echo "Exec role: $EXEC_ROLE_ARN"

          # ── CloudWatch Log Group ────────────────────────────────────────────
          aws logs create-log-group --log-group-name "${LOG_GROUP}" 2>/dev/null || true

          # ── Target Group (port 80, bank) ────────────────────────────────────
          TG_NAME="${CLUSTER}-tg"
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names "$TG_NAME" \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text 2>/dev/null || true)

          if [ -z "$TG_ARN" ] || [ "$TG_ARN" = "None" ]; then
            TG_ARN=$(aws elbv2 create-target-group \
              --name "$TG_NAME" \
              --protocol HTTP --port 80 \
              --vpc-id "$VPC_ID" \
              --target-type ip \
              --health-check-path "/" \
              --health-check-interval-seconds 30 \
              --healthy-threshold-count 2 \
              --unhealthy-threshold-count 2 \
              --query "TargetGroups[0].TargetGroupArn" --output text)
          fi
          echo "Bank TG: $TG_ARN"

          # ── ALB Listener port 80 ────────────────────────────────────────────
          LISTENER_ARN=$(aws elbv2 describe-listeners \
            --load-balancer-arn "$ALB_ARN" \
            --query "Listeners[?Port==\`80\`].ListenerArn | [0]" \
            --output text 2>/dev/null || true)

          if [ -z "$LISTENER_ARN" ] || [ "$LISTENER_ARN" = "None" ]; then
            aws elbv2 create-listener \
              --load-balancer-arn "$ALB_ARN" \
              --protocol HTTP --port 80 \
              --default-actions "Type=forward,TargetGroupArn=${TG_ARN}"
          fi

          # ── Register Task Definition ────────────────────────────────────────
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --family "${CLUSTER}" \
            --requires-compatibilities FARGATE \
            --network-mode awsvpc \
            --cpu 256 --memory 512 \
            --execution-role-arn "${EXEC_ROLE_ARN}" \
            --container-definitions "[{
              \"name\": \"${{ env.CONTAINER_BANK }}\",
              \"image\": \"${IMAGE_URI}\",
              \"essential\": true,
              \"portMappings\": [{\"containerPort\": 80, \"hostPort\": 80, \"protocol\": \"tcp\"}],
              \"logConfiguration\": {
                \"logDriver\": \"awslogs\",
                \"options\": {
                  \"awslogs-group\": \"${LOG_GROUP}\",
                  \"awslogs-region\": \"${REGION}\",
                  \"awslogs-stream-prefix\": \"${{ env.CONTAINER_BANK }}\"
                }
              }
            }]" \
            --query "taskDefinition.taskDefinitionArn" --output text)
          echo "Task def: $TASK_DEF_ARN"

          # ── Create or Update ECS Service ────────────────────────────────────
          ACTIVE=$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${{ env.SERVICE_BANK }}" \
            --query "services[?status=='ACTIVE'].serviceName" \
            --output text 2>/dev/null || true)

          if echo "${ACTIVE}" | grep -q "${{ env.SERVICE_BANK }}"; then
            echo "Updating existing bank service..."
            aws ecs update-service \
              --cluster "${CLUSTER}" \
              --service "${{ env.SERVICE_BANK }}" \
              --task-definition "${TASK_DEF_ARN}" \
              --force-new-deployment
          else
            echo "Creating bank service..."
            aws ecs create-service \
              --cluster "${CLUSTER}" \
              --service-name "${{ env.SERVICE_BANK }}" \
              --task-definition "${TASK_DEF_ARN}" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration \
                "awsvpcConfiguration={subnets=[${SUBNET_IDS}],securityGroups=[${SG_ID}],assignPublicIp=ENABLED}" \
              --load-balancers \
                "targetGroupArn=${TG_ARN},containerName=${{ env.CONTAINER_BANK }},containerPort=80"
          fi

          # ── Wait for stability ──────────────────────────────────────────────
          echo "Waiting for Demo Bank service stability..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${{ env.SERVICE_BANK }}"

          echo ""
          echo "========================================="
          echo "  Demo Bank → http://${ALB_DNS}"
          echo "========================================="

# ── Job 2: Deploy SDLC Dashboard (port 8080) ──────────────────────────────────
  deploy-sdlc:
    name: Deploy SDLC Dashboard → port 8080
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-region:            ${{ secrets.AWS_REGION }}
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Ensure SDLC ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPO_SDLC }} \
            || aws ecr create-repository --repository-name ${{ env.ECR_REPO_SDLC }}

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build SDLC Dashboard
        run: |
          npm install --legacy-peer-deps
          CI=false REACT_APP_MODE=sdlc npm run build

      - name: Build and push SDLC Dashboard image
        id: build-sdlc
        run: |
          set -eo pipefail
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO_SDLC }}:${{ github.sha }}
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_OUTPUT
          docker build --platform linux/amd64 -f Dockerfile.sdlc -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Provision & deploy SDLC Dashboard ECS service
        env:
          IMAGE_URI: ${{ steps.build-sdlc.outputs.IMAGE_URI }}
        run: |
          set -eo pipefail
          set -x

          LOG_GROUP="/ecs/${CLUSTER}-sdlc"
          REGION="${{ env.AWS_REGION }}"

          # ── Resolve ALB and networking ──────────────────────────────────────
          ALB_ARN=$(aws elbv2 describe-load-balancers \
            --names "${{ env.ALB_NAME }}" \
            --query "LoadBalancers[0].LoadBalancerArn" --output text)
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ env.ALB_NAME }}" \
            --query "LoadBalancers[0].DNSName" --output text)

          SG_ID=$(aws elbv2 describe-load-balancers \
            --names "${{ env.ALB_NAME }}" \
            --query "LoadBalancers[0].SecurityGroups[0]" --output text)

          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query "Vpcs[0].VpcId" --output text)

          SUBNET_IDS=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=${VPC_ID}" \
            --query "Subnets[*].SubnetId" --output text | tr '\t' ',')

          EXEC_ROLE_ARN=$(aws iam get-role \
            --role-name "${{ env.EXEC_ROLE_NAME }}" \
            --query "Role.Arn" --output text)

          # ── Ensure port 8080 open on ALB SG ────────────────────────────────
          aws ec2 authorize-security-group-ingress \
            --group-id "${SG_ID}" \
            --protocol tcp --port 8080 --cidr 0.0.0.0/0 \
            && echo "Port 8080 rule added" \
            || echo "Port 8080 rule already exists"

          # ── CloudWatch Log Group ────────────────────────────────────────────
          aws logs create-log-group --log-group-name "${LOG_GROUP}" 2>/dev/null || true

          # ── Target Group (port 8080, SDLC) ──────────────────────────────────
          TG_NAME="${CLUSTER}-sdlc-tg"
          TG_ARN=$(aws elbv2 describe-target-groups \
            --names "${TG_NAME}" \
            --query "TargetGroups[0].TargetGroupArn" \
            --output text 2>/dev/null || true)

          if [ -z "${TG_ARN}" ] || [ "${TG_ARN}" = "None" ]; then
            TG_ARN=$(aws elbv2 create-target-group \
              --name "${TG_NAME}" \
              --protocol HTTP --port 80 \
              --vpc-id "${VPC_ID}" \
              --target-type ip \
              --health-check-path "/" \
              --health-check-interval-seconds 30 \
              --healthy-threshold-count 2 \
              --unhealthy-threshold-count 2 \
              --query "TargetGroups[0].TargetGroupArn" --output text)
          fi
          echo "SDLC TG: $TG_ARN"

          # ── ALB Listener port 8080 ──────────────────────────────────────────
          LISTENER_ARN=$(aws elbv2 describe-listeners \
            --load-balancer-arn "${ALB_ARN}" \
            --query "Listeners[?Port==\`8080\`].ListenerArn | [0]" \
            --output text 2>/dev/null || true)

          if [ -z "${LISTENER_ARN}" ] || [ "${LISTENER_ARN}" = "None" ]; then
            aws elbv2 create-listener \
              --load-balancer-arn "${ALB_ARN}" \
              --protocol HTTP --port 8080 \
              --default-actions "Type=forward,TargetGroupArn=${TG_ARN}"
          fi

          # ── Register Task Definition ────────────────────────────────────────
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --family "${CLUSTER}-sdlc" \
            --requires-compatibilities FARGATE \
            --network-mode awsvpc \
            --cpu 256 --memory 512 \
            --execution-role-arn "${EXEC_ROLE_ARN}" \
            --container-definitions "[{
              \"name\": \"${{ env.CONTAINER_SDLC }}\",
              \"image\": \"${IMAGE_URI}\",
              \"essential\": true,
              \"portMappings\": [{\"containerPort\": 80, \"hostPort\": 80, \"protocol\": \"tcp\"}],
              \"logConfiguration\": {
                \"logDriver\": \"awslogs\",
                \"options\": {
                  \"awslogs-group\": \"${LOG_GROUP}\",
                  \"awslogs-region\": \"${REGION}\",
                  \"awslogs-stream-prefix\": \"${{ env.CONTAINER_SDLC }}\"
                }
              }
            }]" \
            --query "taskDefinition.taskDefinitionArn" --output text)
          echo "Task def: $TASK_DEF_ARN"

          # ── Create or Update ECS Service ────────────────────────────────────
          ACTIVE=$(aws ecs describe-services \
            --cluster "${CLUSTER}" \
            --services "${{ env.SERVICE_SDLC }}" \
            --query "services[?status=='ACTIVE'].serviceName" \
            --output text 2>/dev/null || true)

          if echo "${ACTIVE}" | grep -q "${{ env.SERVICE_SDLC }}"; then
            echo "Updating existing SDLC service..."
            aws ecs update-service \
              --cluster "${CLUSTER}" \
              --service "${{ env.SERVICE_SDLC }}" \
              --task-definition "${TASK_DEF_ARN}" \
              --force-new-deployment
          else
            echo "Creating SDLC service..."
            aws ecs create-service \
              --cluster "${CLUSTER}" \
              --service-name "${{ env.SERVICE_SDLC }}" \
              --task-definition "${TASK_DEF_ARN}" \
              --desired-count 1 \
              --launch-type FARGATE \
              --network-configuration \
                "awsvpcConfiguration={subnets=[${SUBNET_IDS}],securityGroups=[${SG_ID}],assignPublicIp=ENABLED}" \
              --load-balancers \
                "targetGroupArn=${TG_ARN},containerName=${{ env.CONTAINER_SDLC }},containerPort=80"
          fi

          # ── Wait for stability ──────────────────────────────────────────────
          echo "Waiting for SDLC Dashboard service stability..."
          aws ecs wait services-stable \
            --cluster "${CLUSTER}" \
            --services "${{ env.SERVICE_SDLC }}"

          echo ""
          echo "========================================="
          echo "  Demo Bank      → http://${ALB_DNS}"
          echo "  SDLC Dashboard → http://${ALB_DNS}:8080"
          echo "========================================="
